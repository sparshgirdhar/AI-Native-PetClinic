[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pipeline"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
	"langchain>=1.0.0",
	"langchain-mcp-adapters>=0.2.0",
	"langchain-openai>=1.0.0",
	"python-dotenv>=1.0.0",
	"gradio>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]